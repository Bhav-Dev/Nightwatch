name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (used by the data-layer tests) needs Node 22.5 or later.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  bundle:
    # Builds the JS bundle for each platform. Signed native builds run on EAS once
    # credentials are set up (see README).
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform ${{ matrix.platform }} --output-dir dist

  server:
    # The API and nightly job (server/). Tests run on PGlite (Postgres in WASM), so no database
    # service is needed; the aggregation test checks its figures against a NumPy reference.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
