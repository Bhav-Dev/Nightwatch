plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.nightwatch.recordingservice'
version = '0.1.0'

android {
  namespace "app.nightwatch.recordingservice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
}
